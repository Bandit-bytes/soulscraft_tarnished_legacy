plugins {
    id 'com.gradleup.shadow'
    id 'me.modmuss50.mod-publish-plugin'
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    modImplementation "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

publishMods {
    file = remapJar.archiveFile
    displayName = "soulscraft-tarnished-legacy-forge-${project.version}"
    version = project.version.toString()
    changelog = rootProject.releaseChangelog()
    type = STABLE
    modLoaders.add("forge")
    dryRun = providers.gradleProperty("curseforge_token").getOrNull() == null || providers.gradleProperty("publishDryRun").isPresent()

    curseforge {
        accessToken = providers.gradleProperty("curseforge_token")
        projectId = "1643668"
        minecraftVersions.add("1.20.1")
        javaVersions.add(JavaVersion.VERSION_17)
        client = true
        server = true
        requires("architectury-api", "geckolib")
        optional("better-combat-by-daedelus")
    }
}

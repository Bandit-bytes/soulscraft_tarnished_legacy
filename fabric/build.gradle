plugins {
    id 'com.gradleup.shadow'
    id 'me.modmuss50.mod-publish-plugin'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"

    modImplementation "dev.architectury:architectury-fabric:$architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

publishMods {
    file = remapJar.archiveFile
    displayName = "soulscraft-tarnished-legacy-fabric-${project.version}"
    version = project.version.toString()
    changelog = rootProject.releaseChangelog()
    type = STABLE
    modLoaders.add("fabric")
    dryRun = providers.gradleProperty("curseforge_token").getOrNull() == null || providers.gradleProperty("publishDryRun").isPresent()

    curseforge {
        accessToken = providers.gradleProperty("curseforge_token")
        projectId = "1643668"
        minecraftVersions.add("1.21.1")
        javaVersions.add(JavaVersion.VERSION_21)
        client = true
        server = true
        requires("fabric-api")
        requires("architectury-api", "geckolib")
        optional("better-combat-by-daedelus")
    }
}

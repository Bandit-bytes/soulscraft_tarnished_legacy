plugins {
    id 'com.gradleup.shadow'
    id 'me.modmuss50.mod-publish-plugin'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modImplementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

publishMods {
    file = remapJar.archiveFile
    displayName = "soulscraft-tarnished-legacy-neoforge-${project.version}"
    version = project.version.toString()
    changelog = rootProject.releaseChangelog()
    type = STABLE
    modLoaders.add("neoforge")
    dryRun = providers.gradleProperty("curseforge_token").getOrNull() == null || providers.gradleProperty("publishDryRun").isPresent()

    curseforge {
        accessToken = providers.gradleProperty("curseforge_token")
        projectId = "1643668"
        minecraftVersions.add("1.21.1")
        javaVersions.add(JavaVersion.VERSION_21)
        client = true
        server = true
        requires("architectury-api", "geckolib")
        optional("better-combat-by-daedelus")
    }
}
